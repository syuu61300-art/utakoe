<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTAKOE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>UTA<span>KOE</span></h1>
      <p data-t="tagline"></p>
    </div>
    <div class="controls">
      <label for="recLang" data-t="recLang"></label>
      <select id="recLang"></select>
      <button class="chip-btn" id="uiToggle" type="button">EN</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="lyrics" id="lyrics" aria-live="polite">
        <p class="placeholder" id="placeholder" data-t="idleStage"></p>
      </div>
      <canvas id="scope" aria-hidden="true"></canvas>
      <div class="deck">
        <button class="mic" id="mic" type="button">
          <span class="halo"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <div class="deck-text">
          <strong id="micLabel"></strong>
          <span class="status" id="status"><span class="dot"></span><span id="statusText"></span></span>
        </div>
      </div>
      <p class="msg" id="msg" hidden></p>
    </section>

    <aside class="song" id="song">
      <span class="eyebrow" data-t="thisSong"></span>
      <div id="songBody"><p class="song-idle" data-t="songIdle"></p></div>
    </aside>

    <section class="log">
      <div class="log-head">
        <h2 data-t="log"></h2>
        <div class="controls">
          <button class="chip-btn" id="copyBtn" type="button" data-t="copy"></button>
          <button class="chip-btn" id="clearBtn" type="button" data-t="clear"></button>
        </div>
      </div>
      <div class="log-body" id="logBody"></div>
    </section>
  </main>
</div>

<script src="js/app.js" defer></script>
</body>
</html>
