<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTAKOE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a dark stage where sung words surface one by one; the identified song sits beside it like a liner note. */
:root{
  --bg:#11131b; --surface:#1a1d28; --line:#2b2f3e; --ink:#eeeae2; --muted:#8d91a6;
  --accent:#f2b24c; --accent-ink:#1a1306; --rec:#ef5b5b;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f5f3ee;--surface:#ffffff;--line:#e2ded4;--ink:#1c1d24;--muted:#6a6d7c;--accent:#b0700f;--accent-ink:#ffffff;--rec:#d33f3e;color-scheme:light}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.7 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 env(safe-area-inset-bottom,0px);min-height:100vh}
.wrap{max-width:1180px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-block:20px 8px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{margin:0;font:800 26px/1 var(--f-display);letter-spacing:.14em}
.brand h1 span{color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:13px}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
select,.chip-btn{font:500 13px var(--f-body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.chip-btn{cursor:pointer}
select#recLang{max-width:min(62vw,260px)}
.auto-badge{font:500 12px var(--f-mono);color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:3px 10px;white-space:nowrap}
.auto-badge.busy::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px;animation:blink 1s infinite}
.msg{line-height:1.7}
select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding-block:16px 40px}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}

/* Stage */
.stage{min-width:0;display:flex;flex-direction:column;gap:18px}
.lyrics{min-height:340px;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding-block:24px;overflow:hidden}
.lyric-line{font:700 clamp(24px,4.2vw,44px)/1.35 var(--f-display);word-break:break-word;transition:opacity .6s, font-size .6s}
.lyric-line:not(:last-child){opacity:.32;font-size:clamp(18px,2.6vw,26px)}
.lyric-line:nth-last-child(n+5){opacity:.14}
.w{display:inline-block;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.w.fresh{color:var(--accent)}
@keyframes rise{from{opacity:0;transform:translateY(.35em);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.thinking{display:inline-flex;gap:.18em;margin-left:.25em;vertical-align:middle}
.thinking i{width:.22em;height:.22em;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.placeholder{color:var(--muted);font:500 clamp(18px,2.4vw,24px)/1.6 var(--f-display);max-width:30ch}

.deck{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.mic{position:relative;flex:none;width:76px;height:76px;border-radius:50%;border:0;cursor:pointer;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:transform .15s}
.mic:hover{transform:scale(1.04)}
.mic svg{width:30px;height:30px}
.mic.on{background:var(--rec);color:#fff}
.mic .halo{position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--rec);opacity:0;transform:scale(var(--lvl,1))}
.mic.on .halo{opacity:.55}
.deck-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.deck-text strong{font-size:16px}
.status{font:400 12px var(--f-mono);color:var(--muted)}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:1px}
.status.live .dot{background:var(--rec);animation:blink 1.2s infinite}
canvas#scope{width:100%;height:84px;display:block;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.msg{color:var(--rec);font-size:13px;margin:0}

/* Song card */
.song{min-width:0;align-self:start;position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:14px}
.eyebrow{font:500 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.song-idle{color:var(--muted);font-size:14px;margin:0}
.ring-wrap{display:flex;align-items:center;gap:14px}
.ring{width:54px;height:54px;flex:none}
.ring circle{fill:none;stroke-width:4}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:151;stroke-dashoffset:151;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.go .fg{animation:fill 5s linear forwards}
@keyframes fill{to{stroke-dashoffset:0}}
.ring text{font:500 14px var(--f-mono);fill:var(--ink)}
.song-title{margin:0;font:800 26px/1.25 var(--f-display);text-wrap:balance}
.song-artist{margin:0;color:var(--muted);font-size:15px}
.meta{font:400 12px var(--f-mono);color:var(--muted)}
.summary{margin:0;font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.links a{display:block;text-align:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 6px;font-size:13px;font-weight:500}
.links a.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);grid-column:1/-1}
.links a:hover{border-color:var(--accent)}
.predict{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.predict-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.predict ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.predict li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:13px}
.predict li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.predict li .nm small{color:var(--muted);margin-left:6px}
.predict li .pc{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--accent)}
.predict li .bar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.predict li .bar i{display:block;height:100%;background:var(--accent);transition:width .4s}
.predict .empty{color:var(--muted);font-size:13px}
.your-lyrics{border-top:1px solid var(--line);padding-top:12px;max-height:220px;overflow:auto}
.your-lyrics p{margin:0;font:500 15px/1.8 var(--f-display)}
.reveal{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}

/* Log */
.log{grid-column:1/-1;border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:10px}
.log-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.log-head h2{margin:0;font:700 18px var(--f-display)}
.log-body{font:400 14px/1.9 var(--f-body);white-space:pre-wrap;color:var(--muted);max-height:240px;overflow:auto;min-height:3em}
.log-body .ts{font:400 11px var(--f-mono);margin-right:10px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>UTA<span>KOE</span></h1>
      <p data-t="tagline"></p>
    </div>
    <div class="controls">
      <label for="recLang" data-t="recLang"></label>
      <select id="recLang"></select>
      <span class="auto-badge" id="autoBadge" hidden></span>
      <button class="chip-btn" id="uiToggle" type="button">EN</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="lyrics" id="lyrics" aria-live="polite">
        <p class="placeholder" id="placeholder" data-t="idleStage"></p>
      </div>
      <canvas id="scope" aria-hidden="true"></canvas>
      <div class="deck">
        <button class="mic" id="mic" type="button">
          <span class="halo"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <div class="deck-text">
          <strong id="micLabel"></strong>
          <span class="status" id="status"><span class="dot"></span><span id="statusText"></span></span>
        </div>
      </div>
      <p class="msg" id="msg" hidden></p>
    </section>

    <aside class="song" id="song">
      <span class="eyebrow" data-t="thisSong"></span>
      <div id="songBody"><p class="song-idle" data-t="songIdle"></p></div>
      <div class="predict" id="predict">
        <div class="predict-head"><span class="eyebrow" data-t="predict"></span><span class="status" id="predictStatus"></span></div>
        <ol id="predictList"></ol>
      </div>
    </aside>

    <section class="log">
      <div class="log-head">
        <h2 data-t="log"></h2>
        <div class="controls">
          <button class="chip-btn" id="copyBtn" type="button" data-t="copy"></button>
          <button class="chip-btn" id="clearBtn" type="button" data-t="clear"></button>
        </div>
      </div>
      <div class="log-body" id="logBody"></div>
    </section>
  </main>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* ---------- 表示文言 ---------- */
const T = {
  ja: {
    tagline:'あなたの歌声を、一語ずつ文字に。', recLang:'歌の言語',
    idleStage:'マイクを押して、歌うか話してください。声が一語ずつここに現れます。',
    start:'歌いはじめる', stop:'止める', listening:'聞いています', paused:'停止中',
    unsupported:'このブラウザは音声の文字化に対応していません。Chrome か Edge で開いてください（波形の表示だけ動きます）。',
    denied:'マイクがブロックされています。アドレスバー左側のアイコン（鍵や設定のマーク）→「マイク」を「許可」にして、ページを再読み込みしてください。',
    insecure:'このページは https で開かれていないため、マイクを使えません。https:// で始まるアドレス（github.io のアドレス）で開いてください。',
    nomedia:'このブラウザではマイクを使えません。Chrome か Safari で開いてください。',
    nomic:'マイクが見つかりません。マイクが接続されているか、ほかのアプリが使っていないか確認してください。',
    inapp:'アプリ内のブラウザ（LINE・Instagram など）ではマイクが使えません。メニューから「ブラウザで開く」を選び、Chrome か Safari で開いてください。',
    github:'ここは GitHub のファイル表示画面です。サイトは https://ユーザー名.github.io/リポジトリ名/ のアドレスで開いてください。',
    network:'音声の文字化サービスにつながりません。Chrome で開き、インターネット接続を確認してください。',
    detecting:'言語を判定中', autoNow:'自動', 
    thisSong:'この曲', songIdle:'曲がわかると、ここに曲名と内容が表示されます。',
    matching:'曲を照合しています', predict:'予測', searchingSong:'曲を検索中', noPredict:'歌い始めて5秒後から候補が出ます', yourLyrics:'あなたが歌った歌詞', year:'発表',
    listen:'YouTubeで聴く', lyrics:'歌詞を見る',
    log:'記録', copy:'コピー', copied:'コピーしました', clear:'消去', auto:'自動判定（歌から言語を判定）'
  },
  en: {
    tagline:'Your singing, word by word.', recLang:'Language',
    idleStage:'Press the mic and sing or speak. Your words will appear here one at a time.',
    start:'Start singing', stop:'Stop', listening:'Listening', paused:'Stopped',
    unsupported:'This browser cannot turn speech into text. Open the page in Chrome or Edge (only the waveform works here).',
    denied:'The microphone is blocked. Click the icon at the left of the address bar, set Microphone to Allow, then reload the page.',
    insecure:'This page is not open over https, so the microphone cannot be used. Open the https:// address (the github.io address).',
    nomedia:'This browser cannot use the microphone. Open the page in Chrome or Safari.',
    nomic:'No microphone was found. Check that one is connected and not in use by another app.',
    inapp:'In-app browsers (LINE, Instagram and others) cannot use the microphone. Choose "Open in browser" from the menu and use Chrome or Safari.',
    github:'This is GitHub\'s file view. Open the site at https://USERNAME.github.io/REPOSITORY/ instead.',
    network:'Cannot reach the speech-to-text service. Use Chrome and check your internet connection.',
    detecting:'Detecting language', autoNow:'Auto', 
    thisSong:'This song', songIdle:'Once the song is recognized, its title and details appear here.',
    matching:'Matching the song', predict:'Predictions', searchingSong:'Searching for the song', noPredict:'Candidates appear 5 seconds after you start singing', yourLyrics:'Lyrics you sang', year:'Released',
    listen:'Listen on YouTube', lyrics:'View lyrics',
    log:'Transcript', copy:'Copy', copied:'Copied', clear:'Clear', auto:'Auto-detect (from your singing)'
  }
};
const LANGS = ['auto','ja-JP','en-US','en-GB','en-AU','en-CA','en-IN','en-IE','en-NZ','en-PH','en-SG','en-ZA','en-KE','en-NG','en-GH','en-TZ','en-PK','en-HK',
  'ko-KR','cmn-Hans-CN','cmn-Hant-TW','yue-Hant-HK',
  'es-ES','es-MX','es-US','es-AR','es-BO','es-CL','es-CO','es-CR','es-DO','es-EC','es-GT','es-HN','es-NI','es-PA','es-PE','es-PR','es-PY','es-SV','es-UY','es-VE',
  'fr-FR','fr-CA','fr-BE','fr-CH','de-DE','de-AT','de-CH','it-IT','it-CH','pt-BR','pt-PT','nl-NL','nl-BE',
  'ru-RU','uk-UA','be-BY','pl-PL','cs-CZ','sk-SK','sl-SI','hr-HR','sr-RS','bs-BA','bg-BG','mk-MK','ro-RO','hu-HU','el-GR','sq-AL',
  'sv-SE','da-DK','nb-NO','fi-FI','is-IS','et-EE','lv-LV','lt-LT','ca-ES','eu-ES','gl-ES','cy-GB','ga-IE','mt-MT','lb-LU',
  'tr-TR','az-AZ','ka-GE','hy-AM','kk-KZ','uz-UZ','ky-KG','tg-TJ','tk-TM','mn-MN',
  'ar-SA','ar-AE','ar-EG','ar-MA','ar-DZ','ar-TN','ar-LY','ar-IQ','ar-JO','ar-KW','ar-LB','ar-QA','ar-BH','ar-OM','ar-YE','ar-SY','ar-PS','ar-IL',
  'he-IL','fa-IR','ps-AF','ku-IQ','ur-PK','ur-IN',
  'hi-IN','bn-IN','bn-BD','pa-Guru-IN','gu-IN','mr-IN','ta-IN','ta-LK','ta-SG','ta-MY','te-IN','kn-IN','ml-IN','or-IN','as-IN','ne-NP','si-LK',
  'th-TH','vi-VN','id-ID','ms-MY','fil-PH','jv-ID','su-ID','km-KH','lo-LA','my-MM',
  'am-ET','sw-KE','sw-TZ','zu-ZA','xh-ZA','af-ZA','st-ZA','so-SO','yo-NG','ig-NG','ha-NG','rw-RW','mg-MG','haw-US','mi-NZ','sm-WS','to-TO'];
const dispTag = c => c.replace(/^cmn-Hans-/, 'zh-Hans-').replace(/^cmn-Hant-/, 'zh-Hant-').replace(/^yue-Hant-/, 'yue-').replace(/^pa-Guru-/, 'pa-');
function langName(code, inLang){
  try{ return new Intl.DisplayNames([inLang || (ui === 'ja' ? 'ja' : 'en')], {type:'language'}).of(dispTag(code)); }catch{ return code; }
}
function langLabel(code){
  const mine = langName(code), native = langName(code, dispTag(code));
  return native && native !== mine ? `${mine}｜${native}` : mine;
}
/* 判定結果（ISO 639-3）→ 音声認識の言語 */
const ISO3 = {jpn:'ja-JP',eng:'en-US',kor:'ko-KR',cmn:'cmn-Hans-CN',yue:'yue-Hant-HK',spa:'es-ES',fra:'fr-FR',deu:'de-DE',ita:'it-IT',por:'pt-BR',nld:'nl-NL',
  rus:'ru-RU',ukr:'uk-UA',bel:'be-BY',pol:'pl-PL',ces:'cs-CZ',slk:'sk-SK',slv:'sl-SI',hrv:'hr-HR',srp:'sr-RS',bos:'bs-BA',bul:'bg-BG',mkd:'mk-MK',ron:'ro-RO',hun:'hu-HU',ell:'el-GR',als:'sq-AL',sqi:'sq-AL',
  swe:'sv-SE',dan:'da-DK',nob:'nb-NO',nno:'nb-NO',fin:'fi-FI',isl:'is-IS',ekk:'et-EE',est:'et-EE',lvs:'lv-LV',lav:'lv-LV',lit:'lt-LT',cat:'ca-ES',eus:'eu-ES',glg:'gl-ES',cym:'cy-GB',gle:'ga-IE',mlt:'mt-MT',ltz:'lb-LU',
  tur:'tr-TR',azj:'az-AZ',azb:'az-AZ',kat:'ka-GE',hye:'hy-AM',kaz:'kk-KZ',uzn:'uz-UZ',kir:'ky-KG',tgk:'tg-TJ',tuk:'tk-TM',khk:'mn-MN',
  arb:'ar-SA',ary:'ar-MA',arz:'ar-EG',heb:'he-IL',pes:'fa-IR',prs:'fa-IR',pbu:'ps-AF',ckb:'ku-IQ',kmr:'ku-IQ',urd:'ur-PK',
  hin:'hi-IN',ben:'bn-IN',pan:'pa-Guru-IN',guj:'gu-IN',mar:'mr-IN',tam:'ta-IN',tel:'te-IN',kan:'kn-IN',mal:'ml-IN',ory:'or-IN',asm:'as-IN',npi:'ne-NP',nep:'ne-NP',sin:'si-LK',
  tha:'th-TH',vie:'vi-VN',ind:'id-ID',zlm:'ms-MY',zsm:'ms-MY',tgl:'fil-PH',jav:'jv-ID',sun:'su-ID',khm:'km-KH',lao:'lo-LA',mya:'my-MM',
  amh:'am-ET',swh:'sw-KE',zul:'zu-ZA',xho:'xh-ZA',afr:'af-ZA',sot:'st-ZA',som:'so-SO',yor:'yo-NG',ibo:'ig-NG',hau:'ha-NG',kin:'rw-RW',plt:'mg-MG',haw:'haw-US',mri:'mi-NZ',smo:'sm-WS',ton:'to-TO'};
function initialAuto(){
  const nl = (navigator.language || 'ja-JP');
  return LANGS.find(c => c.toLowerCase() === nl.toLowerCase()) || LANGS.find(c => c !== 'auto' && c.split('-')[0] === nl.split('-')[0]) || 'ja-JP';
}
let autoLang = initialAuto();

const store = {
  get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch{} }
};
let ui = store.get('utakoe-ui') || ((navigator.language||'ja').startsWith('ja') ? 'ja' : 'en');
const t = k => T[ui][k] ?? k;

function applyText(){
  document.documentElement.lang = ui;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('#uiToggle').textContent = ui === 'ja' ? 'EN' : '日本語';
  $('#micLabel').textContent = listening ? t('stop') : t('start');
  $('#statusText').textContent = listening ? t('listening') : t('paused');
  const sel = $('#recLang'), cur = sel.value || store.get('utakoe-lang') || 'auto';
  sel.innerHTML = '';
  LANGS.forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v === 'auto' ? t('auto') : langLabel(v); sel.appendChild(o); });
  sel.value = LANGS.includes(cur) ? cur : 'auto';
  updateBadge();
  if (currentSong && songPhase === 'shown') renderSong(currentSong);
}
const isAuto = () => $('#recLang').value === 'auto';
const recLang = () => isAuto() ? autoLang : $('#recLang').value;
let detectBusy = false, detectedOnce = false;
function updateBadge(){
  const b = $('#autoBadge'); if (!b) return;
  b.hidden = !isAuto();
  b.classList.toggle('busy', listening && !detectedOnce);
  const pc = detectedOnce && langAvg[autoLang] ? ` ${Math.round(Math.min(1, langAvg[autoLang]) * 100)}%` : '';
  b.textContent = listening && !detectedOnce ? t('detecting') : `${t('autoNow')}: ${langName(autoLang)}${pc}`;
}

/* ---------- 状態 ---------- */
let listening = false, rec = null, stream = null, audioCtx = null, analyser = null, raf = 0;
const queue = []; let lastRevealAt = 0, pumpTimer = null;
const words = [];                 // 表示済みの全単語
const logLines = [[]];            // 行ごとの単語
let currentLine = null;
const caret = document.createElement('span');
caret.className = 'thinking'; caret.innerHTML = '<i></i><i></i><i></i>';

/* ---------- 単語分割（日本語・中国語・タイ語にも対応） ---------- */
function segment(text, lang){
  if ('Segmenter' in Intl){
    try{
      const seg = new Intl.Segmenter(lang, {granularity:'word'});
      return [...seg.segment(text)].filter(s => s.isWordLike).map(s => s.segment);
    }catch{}
  }

}

    const tm = setTimeout(() => done(null), timeout);

    const el2 = (performance.now() - segStartAt) / 1000;
    const ready = (top.pct >= 0.6 && top.score >= 4) || (el2 >= 15 && top.pct >= 0.35) || (el2 > 15 && top.pct >= 0.5);
    if (ready && top.key !== currentKey) think(Object.assign({match: true, confidence: top.pct}, top), top.key);
  }catch{} finally{ searchBusy = false; }
}
async function maybeIdentifyServer(){
  const body = {text: joinWords(words.slice(-90)), lang: recLang(), ui};
  if (cfg.audio && lastClip){ body.audio = await toB64(lastClip); body.mime = lastClip.type; }
  const r = await fetch('api/identify', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
  if (!r.ok) return;
  const j = await r.json();
  if (j.match && j.confidence >= 0.6 && j.title){
    const key = (j.title + '|' + j.artist).toLowerCase();
    renderPredict([{title: j.title, artist: j.artist, pct: j.confidence}]);
    if (key !== currentKey) think(j, key);
  }
}
function maybeIdentify(){ onWordShown(); }
// 曲を出す前の「考え中」は1〜3秒（確信度が高いほど短い）
function think(song, key){
  songPhase = 'thinking';
  const secs = song.confidence >= 0.8 ? 1 : song.confidence >= 0.6 ? 2 : 3;
  const body = $('#songBody');
  body.innerHTML = `<div class="ring-wrap reveal"><svg class="ring" viewBox="0 0 54 54"><circle class="bgc" cx="27" cy="27" r="24"/><circle class="fg" cx="27" cy="27" r="24"/><text x="27" y="32" text-anchor="middle" id="cnt">${secs}</text></svg><strong></strong></div>`;
  body.querySelector('strong').textContent = t('matching');
  const ring = body.querySelector('.ring'); ring.querySelector('.fg').style.animationDuration = secs + 's';
  requestAnimationFrame(() => ring.classList.add('go'));
  let n = secs;
  const iv = setInterval(() => { n--; const c = $('#cnt'); if (c) c.textContent = Math.max(n, 0); }, 1000);
  setTimeout(() => {
    clearInterval(iv);
    currentSong = song; currentKey = key; songPhase = 'shown';
    songFromLine = Math.max(0, logLines.length - 4);
    renderSong(song);
  }, secs * 1000);
}
const q = s => encodeURIComponent(s);
function link(href, label, cls){ const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener'; a.textContent = label; if (cls) a.className = cls; return a; }

function renderYourLyrics(){

  yl.innerHTML = '';

/* ---------- 歌から言語を自動判定（別スレッドで動かし、画面を止めない） ---------- */
let ring = [], ringLen = 0, srcRate = 48000, procNode = null, detectIv = 0, lastDet = '', detStreak = 0;
const WORKLET_SRC = "class C extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(2048);this.n=0}process(i){const c=i[0]&&i[0][0];if(c){for(let k=0;k<c.length;k++){this.b[this.n++]=c[k];if(this.n===2048){this.port.postMessage(this.b,[this.b.buffer]);this.b=new Float32Array(2048);this.n=0}}}return true}}registerProcessor('uk-cap',C)";
let workletReady = null;
function pushRing(d){ ring.push(d); ringLen += d.length; while (ringLen > srcRate * 9){ ringLen -= ring.shift().length; } }
async function startCapture(src){
  ring = []; ringLen = 0; srcRate = audioCtx.sampleRate;
  try{ procNode && procNode.disconnect(); }catch{}
  procNode = null;
  const ctxRef = audioCtx;
  const mute = audioCtx.createGain(); mute.gain.value = 0; mute.connect(audioCtx.destination);
  try{
    if (!audioCtx.audioWorklet) throw 0;
    if (!workletReady || workletReady.ctx !== ctxRef){
      workletReady = {ctx: ctxRef, p: ctxRef.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET_SRC], {type:'text/javascript'})))};
    }
    await workletReady.p;
    if (audioCtx !== ctxRef) return;
    const node = new AudioWorkletNode(audioCtx, 'uk-cap');
    node.port.onmessage = e => pushRing(e.data);
    src.connect(node); node.connect(mute); procNode = node;
  }catch{
    try{
      const node = audioCtx.createScriptProcessor(4096, 1, 1);
      node.onaudioprocess = e => pushRing(new Float32Array(e.inputBuffer.getChannelData(0)));
      src.connect(node); node.connect(mute); procNode = node;
    }catch{ procNode = null; }
  }
}
function lastSeconds(sec){
  const need = Math.min(ringLen, Math.floor(srcRate * sec)), out = new Float32Array(need);
  let off = need;
  for (let i = ring.length - 1; i >= 0 && off > 0; i--){
    const c = ring[i], take = Math.min(c.length, off);
    out.set(c.subarray(c.length - take), off - take); off -= take;
  }
  return out;
}
function to16k(x){
  const r = srcRate / 16000, n = Math.floor(x.length / r), o = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const a = Math.floor(i * r), b = Math.min(x.length, Math.floor((i + 1) * r));
    let s = 0; for (let j = a; j < b; j++) s += x[j];
    o[i] = s / Math.max(1, b - a);
  }
  return o;
}
const WHISPER_CODES = ['en','zh','de','es','ru','ko','fr','ja','pt','tr','pl','ca','nl','ar','sv','it','id','hi','fi','vi','he','uk','el','ms','cs','ro','da','hu','ta','no','th','ur','hr','bg','lt','la','mi','ml','cy','sk','te','fa','lv','bn','sr','az','sl','kn','et','mk','br','eu','is','hy','ne','mn','bs','kk','sq','sw','gl','mr','pa','si','km','sn','yo','so','af','oc','ka','be','tg','sd','gu','am','yi','lo','uz','fo','ht','ps','tk','nn','mt','sa','lb','my','bo','tl','mg','as','tt','haw','ln','ha','ba','jw','su','yue'];
const WHISPER_TO_LOCALE = {en:'en-US',zh:'cmn-Hans-CN',yue:'yue-Hant-HK',pt:'pt-BR',ar:'ar-SA',no:'nb-NO',nn:'nb-NO',ur:'ur-PK',bn:'bn-IN',pa:'pa-Guru-IN',sw:'sw-KE',tl:'fil-PH',jw:'jv-ID',ta:'ta-IN',es:'es-ES',fr:'fr-FR',de:'de-DE',it:'it-IT',nl:'nl-NL'};
const whisperToLocale = c => WHISPER_TO_LOCALE[c] || LANGS.find(l => l !== 'auto' && l.split('-')[0] === c) || null;

// 別スレッド（Worker）で動く判定処理
function detectorWorker(){
  let P = null;
  function load(codes){
    if (!P){
      P = (async () => {
        const tf = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2/dist/transformers.min.js');
        const id = 'Xenova/whisper-base';
        const [processor, tokenizer, model] = await Promise.all([
          tf.AutoProcessor.from_pretrained(id),
          tf.AutoTokenizer.from_pretrained(id),
          tf.WhisperForConditionalGeneration.from_pretrained(id)
        ]);
        const langIds = codes.map(c => [c, tokenizer.model.tokens_to_ids.get('<|' + c + '|>')]).filter(x => typeof x[1] === 'number');
        const sotId = tokenizer.model.tokens_to_ids.get('<|startoftranscript|>');
        return {tf, processor, model, langIds, sot: typeof sotId === 'number' ? sotId : 50258};
      })();
      P.catch(() => { P = null; });
    }
    return P;
  }
  self.onmessage = async e => {
    const {id, audio, codes, warm} = e.data;
    try{
      const m = await load(codes);
      if (warm){ self.postMessage({id, ready: true}); return; }
      const {input_features} = await m.processor(audio);
      const dec = new m.tf.Tensor('int64', BigInt64Array.from([BigInt(m.sot)]), [1, 1]);
      const out = await m.model({input_features, decoder_input_ids: dec});
      const logits = out.logits.data, V = out.logits.dims[out.logits.dims.length - 1], base = logits.length - V;
      let max = -Infinity; for (const [, i] of m.langIds) max = Math.max(max, logits[base + i]);
      let sum = 0; const sc = m.langIds.map(([c, i]) => { const v = Math.exp(logits[base + i] - max); sum += v; return [c, v]; });
      const probs = {}; sc.forEach(([c, v]) => { probs[c] = v / sum; });
      self.postMessage({id, probs});
    }catch(err){ self.postMessage({id, error: String(err && err.message || err)}); }
  };
}
let detWorker = null, detSeq = 0;
const detWaiting = new Map();
function getDetWorker(){
  if (!detWorker){
    try{
      const url = URL.createObjectURL(new Blob(['(' + detectorWorker.toString() + ')()'], {type:'text/javascript'}));
      detWorker = new Worker(url, {type:'module'});
      detWorker.onmessage = e => { const f = detWaiting.get(e.data.id); if (f){ detWaiting.delete(e.data.id); f(e.data); } };
      detWorker.onerror = () => { detWaiting.forEach(f => f({error:'worker'})); detWaiting.clear(); try{ detWorker.terminate(); }catch{} detWorker = null; };
    }catch{ detWorker = null; }
  }
  return detWorker;
}
function askDetector(msg, transfer){
  return new Promise(res => {
    const w = getDetWorker(); if (!w){ res({error:'noworker'}); return; }
    const id = ++detSeq; detWaiting.set(id, res);
    w.postMessage(Object.assign({id, codes: WHISPER_CODES}, msg), transfer || []);
    setTimeout(() => { if (detWaiting.has(id)){ detWaiting.delete(id); res({error:'timeout'}); } }, 180000);
  });
}
// 判定結果を積み重ねて平均し、何度も同じ言語と判断されたときだけ切り替える（英語⇔日本語の行ったり来たりを防ぐ）
let langAvg = {}, detCount = 0, sinceSwitch = 0, lastSwitchAt = 0;
async function detectOnce(){
  if (!listening || !isAuto() || detectBusy || !procNode) return;
  const chunk = lastSeconds(8);
  if (chunk.length < srcRate * 4) return;
  let e = 0; for (let i = 0; i < chunk.length; i += 4) e += chunk[i] * chunk[i];
  if (Math.sqrt(e / (chunk.length / 4)) < 0.015) return;   // 声が小さい・無音のときは判定しない
  if (performance.now() - heardAt > 4000) return;           // 実際に言葉が聞こえている間だけ判定
  detectBusy = true;
  try{
    const audio = to16k(chunk);
    const r = await askDetector({audio}, [audio.buffer]);
    if (r.error || !r.probs) return;
    // 認識できる言語に集約
    const byLocale = {};
    for (const [c, p] of Object.entries(r.probs)){ const loc = whisperToLocale(c); if (loc) byLocale[loc] = (byLocale[loc] || 0) + p; }
    const keys = new Set([...Object.keys(langAvg), ...Object.keys(byLocale)]);
    keys.forEach(k => { langAvg[k] = (langAvg[k] || 0) * 0.6 + (byLocale[k] || 0) * 0.4; });
    detCount++; sinceSwitch++;
    const ranked = Object.entries(langAvg).sort((a, b) => b[1] - a[1]);
    const [best, bestP] = ranked[0] || [];
    const curP = langAvg[autoLang] || 0;
    if (!best) return;
    const first = !detectedOnce;
    const ok = best !== autoLang && (
      first ? (detCount >= 2 && bestP >= 0.5 && bestP - curP >= 0.2)
            : (sinceSwitch >= 3 && bestP >= 0.6 && bestP - curP >= 0.3 && performance.now() - lastSwitchAt > 15000)
    );
    if (ok){
      pendingLang = best; sinceSwitch = 0; lastSwitchAt = performance.now();
      if (performance.now() - heardAt > 1200) applyPendingLang();
    }
    if (detCount >= 2 && (best === autoLang || pendingLang === best)) detectedOnce = true;
  }finally{ detectBusy = false; updateBadge(); }
}
function startDetect(){
  clearInterval(detectIv);
  detectedOnce = false; detStreak = 0; lastDet = ''; pendingLang = null; langAvg = {}; detCount = 0; sinceSwitch = 0; lastSwitchAt = 0;
  if (isAuto()){ askDetector({warm: true}); detectIv = setInterval(detectOnce, 2500); }
  updateBadge();
}

/* ---------- 開始・停止 ---------- */
function showMsg(m){ const el = $('#msg'); el.textContent = m; el.hidden = !m; }
async function start(){
  showMsg('');
  if (/github\.com$|githubusercontent\.com$/.test(location.hostname)){ showMsg(t('github')); return; }
  if (!window.isSecureContext){ showMsg(t('insecure')); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ showMsg(IN_APP ? t('inapp') : t('nomedia')); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:false, autoGainControl:true}});
  }catch(err){
    const n = err && err.name;
    showMsg(n === 'NotFoundError' || n === 'OverconstrainedError' ? t('nomic') : n === 'NotReadableError' ? t('nomic') : IN_APP ? t('inapp') : t('denied'));
    return;
  }
  listening = true; srBlocked = false; recActive = false; recStarting = false; setUI();
  startScope();
  if (SR) startRecognition(); else showMsg(t('unsupported'));
  startWatchdog(); startClips(); startDetect();
  clearInterval(songTick); songTick = setInterval(songLoop, 250); renderPredict(scoreCands());
}
const IN_APP = /Line\/|FBAN|FBAV|Instagram|Twitter|TikTok|MicroMessenger|KAKAOTALK/i.test(navigator.userAgent);
function stop(){
  listening = false; setUI();
  clearInterval(watchdog); clearInterval(songTick);
  try{ rec && rec.stop(); }catch{}          // stop：話している途中の言葉も最後まで受け取ってから終わる
  try{ clipRec && clipRec.state !== 'inactive' && clipRec.stop(); }catch{}
  stream?.getTracks().forEach(tr => tr.stop());
  clearInterval(detectIv); try{ procNode && procNode.disconnect(); }catch{} procNode = null;
  cancelAnimationFrame(raf); analyser = null; audioCtx?.close(); audioCtx = null; workletReady = null;
  $('#mic').style.setProperty('--lvl', 1); idleScope();
}
function setUI(){
  $('#mic').classList.toggle('on', listening);
  $('#mic').setAttribute('aria-label', listening ? t('stop') : t('start'));
  $('#status').classList.toggle('live', listening);
  $('#micLabel').textContent = listening ? t('stop') : t('start');
  $('#statusText').textContent = listening ? t('listening') : t('paused');

}

$('#mic').addEventListener('click', () => listening ? stop() : start());
$('#recLang').addEventListener('change', e => {
  store.set('utakoe-lang', e.target.value);
  if (listening){
    startDetect();
    if (!isAuto()){ pendingLang = null; try{ rec && rec.stop(); }catch{} }   // 手動で選んだときはすぐ切り替え
  }
  updateBadge();
});
$('#uiToggle').addEventListener('click', () => { ui = ui === 'ja' ? 'en' : 'ja'; store.set('utakoe-ui', ui); applyText(); setUI(); });
$('#copyBtn').addEventListener('click', async () => {
  const text = logLines.filter(l => l.length).map(joinWords).join('\n');
  try{ await navigator.clipboard.writeText(text); const b = $('#copyBtn'); b.textContent = t('copied'); setTimeout(() => b.textContent = t('copy'), 1500); }catch{}
});
$('#clearBtn').addEventListener('click', () => {
  words.length = 0; logLines.length = 0; logLines.push([]); logTimes = []; currentLine = null; queue.length = 0;
  currentKey = ''; currentSong = null; songPhase = 'idle'; segStartAt = 0; lastWordAt = 0; pool.clear(); cands = new Map(); renderPredict([]);
  $('#lyrics').innerHTML = `<p class="placeholder" id="placeholder">${t('idleStage')}</p>`;
  $('#songBody').innerHTML = `<p class="song-idle">${t('songIdle')}</p>`;
  renderLog();
});

applyText(); setUI(); idleScope(); renderPredict([]);
if (/github\.com$|githubusercontent\.com$/.test(location.hostname)) showMsg(t('github'));
else if (!window.isSecureContext) showMsg(t('insecure'));
else if (IN_APP) showMsg(t('inapp'));
else if (navigator.permissions?.query){
  navigator.permissions.query({name:'microphone'}).then(p => { if (p.state === 'denied') showMsg(t('denied')); }).catch(() => {});
}
addEventListener('resize', () => { if (!listening) idleScope(); });
fetch('api/config').then(r => r.ok ? r.json() : null).then(c => { if (c) cfg = c; }).catch(() => {});
})();
